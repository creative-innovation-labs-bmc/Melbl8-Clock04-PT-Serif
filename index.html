<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#373A36">
  <title>Melbourne Typewriter Clock — PT Serif</title>

  <link rel="preload" href="assets/fonts/PT_Serif-Web-Bold.ttf?v=20260813-local" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/OpenSans-Variable.ttf?v=20260813-local" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20260813-localfonts">
</head>
<body>
  <main id="viewport" aria-label="Melbourne natural-language clock">
    <section id="stage" aria-label="The current time and weather in Melbourne">
      <div id="safeArea" class="safe-area" aria-hidden="true"></div>

      <header class="top-status" aria-label="Clock status">
        <span id="modeLabel" class="mode-label" hidden>Demo</span>
        <span id="statusLabel" class="status-label">Live</span>
      </header>

      <div id="messageFrame" class="message-frame">
        <div id="singleLine" class="message-line" role="timer" aria-live="polite" aria-atomic="true">
          <span id="beforeCursor"></span><span id="cursor" class="cursor" aria-hidden="true" hidden></span><span id="afterCursor"></span>
        </div>
        <div id="messageMeasure" class="message-line message-measure" aria-hidden="true"></div>
      </div>

      <footer class="footer-row">
        <div class="location-block">
          <span class="location">Melbourne</span>
          <span class="separator" aria-hidden="true">·</span>
          <span id="dateLabel" class="date-label"></span>
        </div>

        <div id="weatherBlock" class="weather-block" aria-label="Live weather for the Aurecon office in Docklands">
          <span class="weather-location">Docklands</span>
          <span class="separator" aria-hidden="true">·</span>
          <span id="weatherTemperature" class="weather-temperature">--.-°C</span>
          <span class="separator" aria-hidden="true">·</span>
          <span id="weatherWind" class="weather-wind">BOM weather</span>
        </div>
      </footer>

      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>

    <div id="rotatePrompt" class="rotate-prompt" hidden>
      <div class="rotate-icon" aria-hidden="true">↻</div>
      <p>Rotate your phone for the full gallery preview</p>
    </div>
  </main>

  <script type="module" src="app-v2.js?v=20260806-weather3"></script>
  <script type="module" src="weather.js?v=20260806-weather3"></script>
</body>
</html>
