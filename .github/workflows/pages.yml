name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository-hosted fonts exist
        run: |
          set -euo pipefail
          test "$(stat -c%s assets/fonts/PT_Serif-Web-Bold.ttf)" -gt 50000
          test "$(stat -c%s assets/fonts/OpenSans-Variable.ttf)" -gt 100000
          grep -F 'PT Serif Local' styles.css
          grep -F 'Open Sans Local' styles.css
          ! grep -F 'fonts.googleapis.com' index.html
          ! grep -F 'fonts.gstatic.com' index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live page uses local fonts only
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "$PAGE_URL" -o /tmp/index.html
          ! grep -F 'fonts.googleapis.com' /tmp/index.html
          ! grep -F 'fonts.gstatic.com' /tmp/index.html
          grep -F 'assets/fonts/PT_Serif-Web-Bold.ttf' /tmp/index.html
          grep -F 'assets/fonts/OpenSans-Variable.ttf' /tmp/index.html

          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "${PAGE_URL%/}/assets/fonts/PT_Serif-Web-Bold.ttf" -o /tmp/pt-serif.ttf
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "${PAGE_URL%/}/assets/fonts/OpenSans-Variable.ttf" -o /tmp/open-sans.ttf
          test "$(stat -c%s /tmp/pt-serif.ttf)" -gt 50000
          test "$(stat -c%s /tmp/open-sans.ttf)" -gt 100000
